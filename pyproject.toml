[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stargate"
version = "0.1.0"
description = "Tiny local orchestrator that lets heterogeneous coding-agent CLIs collaborate on one task."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dogo", email = "diautilio@gmail.com" }]
keywords = ["agents", "claude-code", "codex", "orchestrator", "git-worktree"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["ruff>=0.16"]

[project.urls]
Homepage = "https://github.com/dogo/stargate"
Source = "https://github.com/dogo/stargate"
Issues = "https://github.com/dogo/stargate/issues"

[project.scripts]
stargate = "stargate.cli:main"

[tool.setuptools]
packages = ["stargate"]

# Prompts and the default config live next to the module so the existing
# __file__-relative lookups keep working once installed.
[tool.setuptools.package-data]
stargate = ["agents.yaml", "prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F are the real errors, I keeps the module seams sorted now that the
# package is nine files, B and UP catch the bugs and dead idioms worth a diff.
select = ["E", "F", "I", "UP", "B"]
