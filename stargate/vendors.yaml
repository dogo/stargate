# Verified vendor blocks for init-config; examples/ is not packaged.
# Keep agents identical to examples/<vendor>/agents.yaml (drift-tested).
# Never guess flags for other CLIs listed by doctor.
version: 1
vendors:
  claude:
    description: Claude Code (examples/claude)
    agents:
      # `claude -p --output-format text` prints only the final message, so these
      # roles need no {output} wrapper -- stdout IS the answer.
      claude_reader:
        command:
          - claude
          - -p
          - --output-format
          - text
          - --disallowedTools
          - Edit Write NotebookEdit
          - --model
          - opus
        probe: "Read the file {probe_file} and reply with its contents, nothing else."
        probe_expect: read

      # Print mode denies edits unless a permission mode allows them. acceptEdits
      # is the narrow one: file edits without prompting, everything else still
      # asks (and in print mode, an ask is a denial).
      claude_writer:
        command:
          - claude
          - -p
          - --output-format
          - text
          - --permission-mode
          - acceptEdits
          - --model
          - sonnet
        probe: "Create the file {probe_file} containing exactly OK, then reply OK."
        probe_expect: write
    # Preserve the packaged reviewer's ability to run the approved test command.
    # The architect runs in the real repository and must not receive this grant.
    # expand_test_command drops the grant when no safe test command is configured.
    # Keep the verified full command: variadic flags must not swallow the prompt.
    reviewer_command:
      - claude
      - -p
      - --output-format
      - text
      - --disallowedTools
      - Edit Write NotebookEdit
      # Print mode otherwise denies arbitrary execution, leaving the reviewer
      # able only to trust the pasted test report. This grant follows the exact
      # command stargate runs and is dropped when none was approved. It is not
      # on the architect because that role runs in the real repository.
      - --allowedTools
      - Bash({test_command})
      - --model
      - opus
  codex:
    description: OpenAI Codex CLI (examples/codex)
    agents:
      # codex exec streams the whole session to stdout, so every role needs
      # {output} -- without it the next role's prompt would be the previous
      # role's trace. -o is codex's own flag for exactly this.
      codex_reader:
        command:
          - codex
          - exec
          - --sandbox
          - read-only
          - --output-last-message
          - "{output}"
        probe: "Read the file {probe_file} and reply with its contents, nothing else."
        probe_expect: read
        usage_pattern: 'tokens used\s+([\d,]+)'

      codex_writer:
        command:
          - codex
          - exec
          - --sandbox
          - workspace-write
          - --output-last-message
          - "{output}"
        probe: "Create the file {probe_file} containing exactly OK, then reply OK."
        probe_expect: write
        usage_pattern: 'tokens used\s+([\d,]+)'
  kiro:
    description: Kiro CLI through kiro-stargate (examples/kiro)
    agents:
      kiro_reader:
        command:
          - kiro-stargate
          - "{output}"
          - --trust-tools=read,grep
        probe: "Read the file {probe_file} and reply with its contents, nothing else."
        probe_expect: read
        usage_pattern: 'Credits:\s+([\d.,]+)'

      kiro_writer:
        command:
          - kiro-stargate
          - "{output}"
          - --trust-all-tools
        probe: "Create the file {probe_file} containing exactly OK, then reply OK."
        probe_expect: write
        # kiro-cli reports fractional credits, not tokens. Capturing the dot makes
        # parse_usage strip it, so the budget counts hundredths of a credit --
        # set max_task_tokens in that same unit or leave it at 0.
        usage_pattern: 'Credits:\s+([\d.,]+)'
  gemini:
    description: Gemini CLI (examples/gemini)
    agents:
      # `gemini --output-format text` prints the answer on stdout, like `claude -p`.
      # No {output} wrapper is needed. Text mode reports no token usage, so neither
      # block has a usage_pattern, just like the Claude text-mode entries.
      #
      # --prompt takes the prompt as its VALUE and is not variadic. Keep it last:
      # stargate appends the prompt immediately after it. These array options would
      # swallow the appended prompt and must NEVER end a command: --policy,
      # --admin-policy, --include-directories, --extensions, --allowed-tools,
      # --allowed-mcp-server-names (the same trap as Claude's --disallowedTools).
      #
      # --skip-trust is required on BOTH blocks: a run's worktree is a fresh directory
      # outside the repository, so it is never trusted. Without it Gemini prints
      # `Approval mode overridden to "default" because the current folder is not trusted`
      # and the writer silently loses its ability to edit.
      #
      # plan is read-only. Unlike Claude Code's --permission-mode plan, Gemini's plan
      # mode answers on stdout instead of diverting the answer to a plan file.
      # --allowed-tools is [DEPRECATED] in 0.60.0 and only bypasses confirmation;
      # it restricts nothing and must not be used as a read-only mechanism.
      # No reviewer_command: plan mode forbids shell execution, so there is no
      # Bash({test_command}) grant like Claude's. The reviewer trusts the pasted
      # test report because the vendor offers no narrower option.
      gemini_reader:
        command:
          - gemini
          - --output-format
          - text
          - --approval-mode
          - plan
          - --skip-trust
          - --prompt
        probe: "Read the file {probe_file} and reply with its contents, nothing else."
        probe_expect: read

      # auto_edit is the narrow mode: edit tools are auto-approved, everything else
      # still prompts, and headless a prompt is a denial. Same reasoning as Claude's
      # acceptEdits. Do not use yolo.
      gemini_writer:
        command:
          - gemini
          - --output-format
          - text
          - --approval-mode
          - auto_edit
          - --skip-trust
          - --prompt
        probe: "Create the file {probe_file} containing exactly OK, then reply OK."
        probe_expect: write
